name: Deploy to snapprints.co.uk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: cPanel pull and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          missing=0
          [ -n "$CPANEL_HOST" ] || { echo "::error::Add the CPANEL_HOST repository secret."; missing=1; }
          [ -n "$CPANEL_USERNAME" ] || { echo "::error::Add the CPANEL_USERNAME repository secret."; missing=1; }
          [ -n "$CPANEL_API_TOKEN" ] || { echo "::error::Add the CPANEL_API_TOKEN repository secret."; missing=1; }
          [ -n "$CPANEL_REPO_ROOT" ] || { echo "::error::Add the CPANEL_REPO_ROOT repository secret."; missing=1; }
          exit "$missing"

      - name: Pull main and deploy through cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          set -euo pipefail

          host="${CPANEL_HOST#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          host="${host%:2083}"
          port="${CPANEL_PORT:-2083}"

          # Try the configured host first. If it cannot complete a TLS
          # handshake (for example a bare IP with no matching certificate),
          # fall back to the site's cPanel hostname and its server hostname.
          # All of these resolve to the same cPanel server.
          candidates=()
          add_candidate() {
            local candidate="$1"
            local existing
            for existing in "${candidates[@]}"; do
              [ "$existing" = "$candidate" ] && return 0
            done
            candidates+=("$candidate")
          }

          add_candidate "${host}:${port}"
          add_candidate "cpanel.snapprints.co.uk:2083"
          site_ip=$(getent ahostsv4 snapprints.co.uk 2>/dev/null | awk 'NR==1 {print $1}')
          if [ -n "$site_ip" ]; then
            server_host=$(getent hosts "$site_ip" 2>/dev/null | awk 'NR==1 {print $2}' | sed 's/\.$//')
            [ -n "$server_host" ] && add_candidate "${server_host}:2083"
          fi

          print_cpanel_failure() {
            local detail=""
            if jq -e . >/dev/null 2>&1 <<<"$response"; then
              # cPanel's /execute endpoint returns the payload unwrapped
              # ({"status":1,...}), while the API docs show it under "result".
              detail=$(jq -r '[(.result.errors // .errors // [])[], (.result.messages // .messages // [])[], (.result.warnings // .warnings // [])[], (.error // empty), (.message // empty)] | map(select(. != null and . != "")) | join(" | ")' <<<"$response" 2>/dev/null || true)
            fi
            if [ -z "$detail" ]; then
              # Fall back to a raw snippet: annotations are readable without
              # signing in, unlike the job log and summary.
              detail=$(printf '%s' "$response" | head -c 600 | tr '\r\n' '  ')
              detail=${detail//'%'/'%25'}
            fi
            {
              echo "## cPanel deployment failed"
              echo ""
              echo '```'
              printf '%s\n' "$response"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            if [ -n "$detail" ]; then
              echo "::error title=cPanel deployment failed::${1} ${detail}"
            else
              echo "::error::$1 (see the job summary for cPanel's response)"
            fi
            echo "--- cPanel response body ---"
            printf '%s\n' "$response"
            echo "--- cPanel error message ---"
            if jq -e . >/dev/null 2>&1 <<<"$response"; then
              jq -r '(.result.errors // .errors // [])[], (.result.messages // .messages // [])[], (.error // empty)' <<<"$response"
            else
              echo "(response body is not JSON)"
            fi
          }

          connected=0
          http_code=""
          response=""
          for candidate in "${candidates[@]}"; do
            echo "Trying cPanel API at https://${candidate} …"
            response_file=$(mktemp)
            curl_status=0
            http_code=$(curl -sS --max-time 60 -o "$response_file" -w '%{http_code}' \
              -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
              --get "https://${candidate}/execute/VersionControl/update" \
              --data-urlencode "repository_root=${CPANEL_REPO_ROOT}" \
              --data-urlencode "branch=main") || curl_status=$?
            response=$(cat "$response_file")
            rm -f "$response_file"

            if [ "$curl_status" -eq 0 ]; then
              connected=1
              api_base="https://${candidate}"
              echo "Connected to ${candidate} (HTTP ${http_code})."
              break
            fi

            echo "::warning::Could not reach ${candidate} (curl exit ${curl_status}, HTTP ${http_code:-none})."
          done

          if [ "$connected" -ne 1 ]; then
            echo "::error::Could not reach the cPanel API on any candidate host. Set CPANEL_HOST=cpanel.snapprints.co.uk and CPANEL_PORT=2083, then re-run."
            echo "--- last cPanel response body ---"
            printf '%s\n' "$response"
            exit 1
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            print_cpanel_failure "cPanel rejected the pull request with HTTP ${http_code}."
            exit 1
          fi

          if ! jq -e . >/dev/null 2>&1 <<<"$response"; then
            print_cpanel_failure "cPanel returned a non-JSON response to the pull (HTTP ${http_code})."
            exit 1
          fi

          jq '{status: (.result.status // .status), errors: (.result.errors // .errors), messages: (.result.messages // .messages)}' <<<"$response"

          if [ "$(jq -r '.result.status // .status // 0' <<<"$response")" != "1" ]; then
            print_cpanel_failure "cPanel could not pull main (HTTP ${http_code})."
            exit 1
          fi

          echo "cPanel pulled main."

          # Deploying only uses the repository's current HEAD, so the pull
          # above must happen first. This call runs .cpanel.yml.
          response_file=$(mktemp)
          curl_status=0
          http_code=$(curl -sS --max-time 60 -o "$response_file" -w '%{http_code}' \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get "${api_base}/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=${CPANEL_REPO_ROOT}") || curl_status=$?
          response=$(cat "$response_file")
          rm -f "$response_file"

          if [ "$curl_status" -ne 0 ]; then
            print_cpanel_failure "cPanel API request failed (curl exit ${curl_status}, HTTP ${http_code:-none})."
            exit 1
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            print_cpanel_failure "cPanel rejected the deployment with HTTP ${http_code}."
            exit 1
          fi

          if ! jq -e . >/dev/null 2>&1 <<<"$response"; then
            print_cpanel_failure "cPanel returned a non-JSON response (HTTP ${http_code})."
            exit 1
          fi

          jq '{status: (.result.status // .status), deploy_id: (.result.data.deploy_id // .data.deploy_id), errors: (.result.errors // .errors), messages: (.result.messages // .messages)}' <<<"$response"

          if [ "$(jq -r '.result.status // .status // 0' <<<"$response")" != "1" ]; then
            print_cpanel_failure "cPanel refused the deployment (HTTP ${http_code})."
            exit 1
          fi

          deploy_id=$(jq -r '.result.data.deploy_id // .data.deploy_id // empty' <<<"$response")
          echo "Deployment id: ${deploy_id:-unknown}"

          if [ -n "$deploy_id" ]; then
            state=""
            for attempt in $(seq 1 6); do
              retrieve=$(curl -sS --max-time 30 \
                -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
                "${api_base}/execute/VersionControlDeployment/retrieve" || true)
              state=$(jq -c --arg id "$deploy_id" '(.result.data // .data // [])[] | select((.deploy_id|tostring) == $id) | {timestamps, repository_state}' <<<"$retrieve" 2>/dev/null || true)
              echo "Deployment status ${attempt}: ${state:-not listed yet}"
              case "$state" in *succeeded*|*failed*|*canceled*) break ;; esac
              sleep 5
            done
            if [ -n "$state" ]; then
              echo "::notice title=cPanel deployment ${deploy_id}::${state}"
            fi
          fi

          # The account defaults cap uploads at 2 MB per file and 8 MB per POST.
          # Apply the same PHP limits as cPanel's MultiPHP INI Editor so photo
          # uploads can use the app's 10 MB cap. This is best-effort; a failed
          # ini change must not roll back an otherwise successful deployment.
          limit_file=$(mktemp)
          limit_code=$(curl -sS --max-time 30 -o "$limit_file" -w '%{http_code}' \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get "${api_base}/execute/LangPHP/php_ini_set_user_basic_directives" \
            --data-urlencode "type=vhost" \
            --data-urlencode "vhost=snapprints.co.uk" \
            --data-urlencode "directive-1=upload_max_filesize:12M" \
            --data-urlencode "directive-2=post_max_size:128M" \
            --data-urlencode "directive-3=memory_limit:256M" || true)
          limit_response=$(cat "$limit_file")
          rm -f "$limit_file"
          if jq -e . >/dev/null 2>&1 <<<"$limit_response" \
            && [ "$(jq -r '.result.status // .status // 0' <<<"$limit_response")" = "1" ]; then
            echo "::notice title=PHP upload limits::Applied 12M upload, 128M POST and 256M memory for snapprints.co.uk."
          else
            echo "::warning title=PHP upload limits::Could not update the vhost PHP limits (HTTP ${limit_code})."
            echo "--- PHP ini response body ---"
            printf '%s\n' "$limit_response"
          fi

      - name: Confirm the deployed version is live
        env:
          SITE_URL: https://snapprints.co.uk/public/index.php
        run: |
          set -euo pipefail

          version=$(grep -oP "const APP_VERSION\s*=\s*'\K[^']+" includes/config.php)
          echo "Waiting for v${version} at ${SITE_URL}"

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT

          for attempt in $(seq 1 18); do
            http_code=$(curl -sS --max-time 20 -o "$body_file" -w '%{http_code}' "$SITE_URL" || true)
            if grep -q "footer-version\">v${version}<" "$body_file"; then
              echo "Live version confirmed: v${version}"
              exit 0
            fi

            # A MySQL-only build intentionally serves 503 until the server's
            # config.local.php exists. Treat that known state as deployed.
            if [ "$http_code" = "503" ] && grep -q "Temporarily unavailable" "$body_file"; then
              echo "::notice::Deployed v${version}; the site is in the expected 503 database-unavailable state."
              exit 0
            fi

            sleep 10
          done

          echo "::error::Deployment was accepted, but v${version} was not live after 3 minutes. Check the cPanel deployment log."
          exit 1
