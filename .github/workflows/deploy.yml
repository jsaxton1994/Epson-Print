name: Deploy to snapprints.co.uk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: cPanel pull and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          missing=0
          [ -n "$CPANEL_HOST" ] || { echo "::error::Add the CPANEL_HOST repository secret."; missing=1; }
          [ -n "$CPANEL_USERNAME" ] || { echo "::error::Add the CPANEL_USERNAME repository secret."; missing=1; }
          [ -n "$CPANEL_API_TOKEN" ] || { echo "::error::Add the CPANEL_API_TOKEN repository secret."; missing=1; }
          [ -n "$CPANEL_REPO_ROOT" ] || { echo "::error::Add the CPANEL_REPO_ROOT repository secret."; missing=1; }
          exit "$missing"

      - name: Ask cPanel to pull main and run .cpanel.yml
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          set -euo pipefail

          host="${CPANEL_HOST#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          host="${host%:2083}"
          port="${CPANEL_PORT:-2083}"

          # Try the configured host first. If it cannot complete a TLS
          # handshake (for example a bare IP with no matching certificate),
          # fall back to the site's cPanel hostname and its server hostname.
          # All of these resolve to the same cPanel server.
          candidates=()
          add_candidate() {
            local candidate="$1"
            local existing
            for existing in "${candidates[@]}"; do
              [ "$existing" = "$candidate" ] && return 0
            done
            candidates+=("$candidate")
          }

          add_candidate "${host}:${port}"
          add_candidate "cpanel.snapprints.co.uk:2083"
          site_ip=$(getent ahostsv4 snapprints.co.uk 2>/dev/null | awk 'NR==1 {print $1}')
          if [ -n "$site_ip" ]; then
            server_host=$(getent hosts "$site_ip" 2>/dev/null | awk 'NR==1 {print $2}' | sed 's/\.$//')
            [ -n "$server_host" ] && add_candidate "${server_host}:2083"
          fi

          connected=0
          http_code=""
          response=""
          for candidate in "${candidates[@]}"; do
            echo "Trying cPanel API at https://${candidate} …"
            response_file=$(mktemp)
            curl_status=0
            http_code=$(curl -sS --max-time 60 -o "$response_file" -w '%{http_code}' \
              -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
              --get "https://${candidate}/execute/VersionControlDeployment/create" \
              --data-urlencode "repository_root=${CPANEL_REPO_ROOT}") || curl_status=$?
            response=$(cat "$response_file")
            rm -f "$response_file"

            if [ "$curl_status" -eq 0 ]; then
              connected=1
              echo "Connected to ${candidate} (HTTP ${http_code})."
              break
            fi

            echo "::warning::Could not reach ${candidate} (curl exit ${curl_status}, HTTP ${http_code:-none})."
          done

          print_cpanel_failure() {
            local detail=""
            if jq -e . >/dev/null 2>&1 <<<"$response"; then
              detail=$(jq -r '[(.result.errors // [])[], (.result.messages // [])[]] | map(select(. != null and . != "")) | join(" | ")' <<<"$response" 2>/dev/null || true)
            fi
            {
              echo "## cPanel deployment failed"
              echo ""
              echo "\`\`\`"
              printf '%s\n' "$response"
              echo "\`\`\`"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            if [ -n "$detail" ]; then
              echo "::error title=cPanel deployment failed::${1} ${detail}"
            else
              echo "::error::$1 (see the job summary for cPanel's response)"
            fi
            echo "--- cPanel response body ---"
            printf '%s\n' "$response"
            echo "--- cPanel error message ---"
            if jq -e . >/dev/null 2>&1 <<<"$response"; then
              jq -r '(.result.errors // [])[], (.result.messages // [])[], (.error // empty)' <<<"$response"
            else
              echo "(response body is not JSON)"
            fi
          }

          if [ "$connected" -ne 1 ]; then
            echo "::error::Could not reach the cPanel API on any candidate host. Set CPANEL_HOST=cpanel.snapprints.co.uk and CPANEL_PORT=2083, then re-run."
            echo "--- last cPanel response body ---"
            printf '%s\n' "$response"
            exit 1
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            print_cpanel_failure "cPanel rejected the API request with HTTP ${http_code}."
            exit 1
          fi

          if ! jq -e . >/dev/null 2>&1 <<<"$response"; then
            print_cpanel_failure "cPanel returned a non-JSON response (HTTP ${http_code})."
            exit 1
          fi

          jq '{status: .result.status, deploy_id: .result.data.deploy_id, errors: .result.errors, messages: .result.messages}' <<<"$response"

          if [ "$(jq -r '.result.status // 0' <<<"$response")" != "1" ]; then
            print_cpanel_failure "cPanel refused the deployment (HTTP ${http_code})."
            exit 1
          fi

      - name: Confirm the deployed version is live
        env:
          SITE_URL: https://snapprints.co.uk/public/index.php
        run: |
          set -euo pipefail

          version=$(grep -oP "const APP_VERSION\s*=\s*'\K[^']+" includes/config.php)
          echo "Waiting for v${version} at ${SITE_URL}"

          for attempt in $(seq 1 18); do
            body=$(curl -fsS --max-time 20 "$SITE_URL" || true)
            if grep -q "footer-version\">v${version}<" <<<"$body"; then
              echo "Live version confirmed: v${version}"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Deployment was accepted, but v${version} was not live after 3 minutes. Check the cPanel deployment log."
          exit 1
